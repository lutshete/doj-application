<!-- Vertical layout -->
<ng-scrollbar style="height: calc(100vh - 60px)" visibility="hover" id="nav-ps-mantis">
  <nav class="navbar-content" role="navigation" aria-label="Primary">
    @if (navigations?.length) {
      <ul class="nav coded-inner-navbar" (clickOutside)="fireOutClick()" (mouseleave)="navMob()">
        @for (item of navigations; track trackById($index, item)) {
          <!-- Groups render their own children -->
          @if (item.type === 'group') {
            <app-nav-group [item]="item"></app-nav-group>
          }
          <!-- (Optional) Root-level single items are supported too -->
          @if (item.type === 'item') {
            <app-nav-item [item]="item"></app-nav-item>
          }
          <!-- (Optional) Root-level collapses (if you ever have them) -->
          @if (item.type === 'collapse') {
            <app-nav-collapse [item]="item"></app-nav-collapse>
          }
        }
      </ul>
    } @else {
      <!-- tiny skeleton while building/filtering -->
      <ul class="nav coded-inner-navbar">
        <li class="nav-skeleton"></li>
        <li class="nav-skeleton"></li>
        <li class="nav-skeleton"></li>
      </ul>
    }
  </nav>
</ng-scrollbar>
