<div class="auth-main">
  <div class="auth-wrapper">
    <div class="auth-form">
      <div class="card my-4 shadow-lg rounded-lg border-0">
        <div class="card-body px-3 py-4">
          <h3 class="text-center mb-3"><strong>Reset Password</strong></h3>

          <!-- Alert -->
          <div *ngIf="alertMessage" class="alert" [ngClass]="{'alert-success': isSuccess, 'alert-danger': !isSuccess}">
            {{ alertMessage }}
          </div>

          <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
            <!-- Email -->
            <div class="form-group mb-3">
              <label class="form-label" for="email">Email Address*</label>
              <input
                id="email"
                type="email"
                formControlName="email"
                class="form-control"
                placeholder="you@example.com"
                [ngClass]="{'is-invalid': isFieldInvalid('email')}"
              />
              <div *ngIf="isFieldInvalid('email')">
                <small class="error" *ngFor="let e of getErrorMessages('email')">{{ e }}</small>
              </div>
            </div>

            <!-- 6-digit code -->
            <div class="form-group mb-3">
              <label class="form-label" for="code">6‑digit Code*</label>
              <input
                id="code"
                type="text"
                inputmode="numeric"
                maxlength="6"
                formControlName="code"
                class="form-control"
                placeholder="Enter the code sent to your email"
                [ngClass]="{'is-invalid': isFieldInvalid('code')}"
              />
              <div *ngIf="isFieldInvalid('code')">
                <small class="error" *ngFor="let e of getErrorMessages('code')">{{ e }}</small>
              </div>
            </div>

            <!-- New Password -->
            <div class="form-group mb-3">
              <label class="form-label" for="newPassword">New Password* (min 8)</label>
              <input
                id="newPassword"
                type="password"
                formControlName="newPassword"
                class="form-control"
                placeholder="New password"
                [ngClass]="{'is-invalid': isFieldInvalid('newPassword')}"
              />
              <div *ngIf="isFieldInvalid('newPassword')">
                <small class="error" *ngFor="let e of getErrorMessages('newPassword')">{{ e }}</small>
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group mb-3">
              <label class="form-label" for="confirmPassword">Confirm Password*</label>
              <input
                id="confirmPassword"
                type="password"
                formControlName="confirmPassword"
                class="form-control"
                placeholder="Confirm password"
                [ngClass]="{'is-invalid': isFieldInvalid('confirmPassword') || resetPasswordForm.hasError('mismatch')}"
              />
              <div *ngIf="isFieldInvalid('confirmPassword')">
                <small class="error" *ngFor="let e of getErrorMessages('confirmPassword')">{{ e }}</small>
              </div>
              <div *ngIf="resetPasswordForm.hasError('mismatch')" class="alert alert-danger text-center mt-2">
                Passwords do not match.
              </div>
            </div>

            <!-- Submit -->
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary shadow" [disabled]="resetPasswordForm.invalid || loading">
                {{ loading ? 'Resetting…' : 'Reset Password' }}
              </button>
            </div>
          </form>

          <p class="text-center mt-3">
            Didn’t get a code?
            <a [routerLink]="['/forgot-password']" class="text-primary">Request code again</a>
            &nbsp;•&nbsp;
            <a [routerLink]="['/login']" class="text-primary">Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
